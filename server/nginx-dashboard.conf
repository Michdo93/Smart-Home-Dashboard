# nginx vor openHAB: HTTPS, Anmeldung und frische Dashboard-Dateien.
# Nach /etc/nginx/sites-available/ kopieren, Namen und Zertifikat anpassen,
# mit sites-enabled/ verknüpfen, dann: sudo nginx -t && sudo systemctl reload nginx
server {
  listen 443 ssl;
  server_name openhab.local;
  ssl_certificate     /etc/nginx/ssl/openhab.crt;
  ssl_certificate_key /etc/nginx/ssl/openhab.key;

  # Anmeldung für alles (Benutzer in /etc/nginx/.htpasswd anlegen)
  auth_basic "Smart Home";
  auth_basic_user_file /etc/nginx/.htpasswd;
  # Wandtablet mit fester Adresse im Heimnetz ohne Passwort
  satisfy any;
  allow 192.168.178.50;
  deny all;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "";   # nginx hat schon geprüft
    # Main UI: Token im Kopf X-OPENHAB-TOKEN statt Authorization schicken
    add_header Set-Cookie X-OPENHAB-AUTH-HEADER=1;
    # Server-Sent Events: openHAB schaltet das Puffern selbst ab
    # (X-Accel-Buffering: no); hier nur lange Pausen erlauben
    proxy_read_timeout 1h;
  }

  # Dashboard-Dateien bei jedem Aufruf prüfen (openHAB sagt: ein Jahr)
  location /static/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Authorization "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;
  }
}

# Unverschlüsselte Aufrufe auf HTTPS umleiten
server {
  listen 80;
  server_name openhab.local;
  return 301 https://$host$request_uri;
}
